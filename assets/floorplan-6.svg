<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500">
  <defs>
    <style>
      .wall {
        fill: none;
        stroke: #fff;
        stroke-width: 7px;
        stroke-linecap: butt;
        stroke-miterlimit: 10;
      }
      .open {
        fill: none;
        stroke: #fff;
        stroke-width: 2px;
        stroke-miterlimit: 10;
        stroke-dasharray: 9 9;
      }
      .thin {
        fill: none;
        stroke: #fff;
        stroke-width: 2px;
        stroke-miterlimit: 10;
      }
      .lbl {
        fill: #fff;
        font-family: NunitoSans-12ptExtraLight, 'Nunito Sans';
        font-size: 26.37px;
        font-variation-settings: 'wght' 200, 'wdth' 100, 'opsz' 12, 'YTLC' 500;
        font-weight: 200;
      }
    </style>
  </defs>
  <g id="Layer_1-2" data-name="Layer 1">
    <!-- outer shell -->
    <rect class="wall" x="20" y="20" width="660" height="460"/>

    <!-- left/right divider with two door gaps -->
    <polyline class="wall" points="420,20 420,180"/>
    <polyline class="wall" points="420,230 420,360"/>
    <polyline class="wall" points="420,410 420,480"/>

    <!-- bedroom / bath divider -->
    <polyline class="wall" points="420,250 520,250"/>
    <polyline class="wall" points="570,250 680,250"/>

    <!-- open kitchen/living zone divider -->
    <line class="open" x1="20" y1="250" x2="420" y2="250"/>
    <polyline class="thin" points="20,60 240,60"/>

    <text class="lbl" transform="translate(70 115)">Kitchen</text>
    <text class="lbl" transform="translate(85 390)">Living Room</text>
    <text class="lbl" transform="translate(490 145)">Bedroom</text>
    <text class="lbl" transform="translate(515 380)">Bath</text>
  </g>
</svg>
