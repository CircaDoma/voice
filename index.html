<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voice Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="shared.js" defer></script>
<script src="student.js" defer></script>
</head>
<body>
<!-- TOOLBAR AREA -->
  <div class="main">
    <div class="section toolBar">
      <div class="textcontainer">
        <h1>Floorplan 1</h1>
        <p>Drag the device to place it on the floorplan.</p>
      </div>
      <div class="container">
        <button class="btn" onclick="clearMyDevices()">
          <img src="assets/reset.svg" alt="Restart" draggable="false">
        </button>
        <img src="assets/device-bank.svg" class="device-token" id="va-token">
        <button class="btn" onclick="submitPlacement()">
          <img src="assets/submit.svg" alt="Submit" draggable="false">
        </button>
      </div>
      <div class="submitted-banner" id="submitted-banner">Placement submitted!</div>
    </div>

<!-- FLOORPLAN AREA -->
    <div class="canvas-area" id="canvas-area">
      <div id="floorplan-container">
        <div class="drop-overlay" id="drop-overlay"></div>
        <img id="floorplan-img" src="assets/floorplan-1.svg" draggable="false">
      </div>
    </div>

    <div class="session-code">
      <span>Session <strong id="session-display">—</strong></span>
    </div>
  </div>
  <div class="room-tooltip" id="room-tooltip"></div>
</body>
</html>
