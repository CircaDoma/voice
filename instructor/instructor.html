<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voice Session — Facilitator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="instructor.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="shared.js" defer></script>
<script src="instructor.js" defer></script>
</head>
<body>
<!-- TOOLBAR AREA -->
  <div class="main">
    <div class="section toolBar">
      <div class="textcontainer">
        <h1>Floorplan 1 — Facilitator</h1>
        <p>Live heatmap of everyone's device placements. Darker = more placements.</p>
      </div>

      <div class="container stats-row">
        <div class="stat">
          <div class="stat-num" id="stat-submissions">0</div>
          <div class="stat-label">Submissions</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="stat-avg">0</div>
          <div class="stat-label">Avg devices</div>
        </div>
        <div class="stat">
          <div class="stat-num stat-room" id="stat-hotspot">—</div>
          <div class="stat-label">Hotspot</div>
        </div>
        <div class="stat">
          <div class="stat-num stat-room" id="stat-missed">—</div>
          <div class="stat-label">Coldest</div>
        </div>
      </div>

      <div class="instructor-actions">
        <button class="ibtn" onclick="refreshHeatmap()">Refresh</button>
        <button class="ibtn danger" onclick="clearAllData()">Clear all data</button>
      </div>
    </div>

<!-- FLOORPLAN AREA -->
    <div class="canvas-area" id="canvas-area">
      <div id="floorplan-container">
        <div class="drop-overlay" id="drop-overlay"></div>
        <img id="floorplan-img" src="assets/floorplan-1.svg" draggable="false">
      </div>
    </div>

    <div class="session-code">
      <span>Session <strong id="session-display">—</strong></span>
      <span class="join-hint" id="join-hint"></span>
    </div>
  </div>
  <div class="room-tooltip" id="room-tooltip"></div>
</body>
</html>
