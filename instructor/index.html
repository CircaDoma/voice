<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voice Session — Facilitator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="instructor.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../scenarios.js" defer></script>
<script src="../shared.js" defer></script>
<script src="instructor.js" defer></script>
</head>
<body>
<!-- SESSION PICKER — shown on load unless the URL carries ?session=CODE -->
  <div class="gate" id="instructor-gate">
    <div class="gate-inner">
      <p class="big-code-label">Voice Assistant Placement</p>
      <h1 class="gate-title-big">Sessions</h1>
      <button class="gate-btn icon-only" onclick="startNewSession()" aria-label="Start new session" title="Start new session">
        <svg viewBox="0 -960 960 960" width="22" height="22" fill="currentColor"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg>
      </button>
      <div class="past-sessions" id="past-sessions"></div>
    </div>
  </div>
<!-- NEW SESSION — code displayed large for the room, then Next → heatmap -->
  <div class="gate" id="new-session-screen">
    <div class="gate-inner">
      <p class="big-code-label">Session code</p>
      <div class="big-code" id="big-code">—</div>
      <button class="big-code-url-btn" id="big-code-url-btn" aria-label="Copy join link" title="Copy join link">
        <svg viewBox="0 -960 960 960" width="22" height="22" fill="currentColor"><path d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z"/></svg>
      </button>
      <p class="join-count" id="join-count">0 <svg viewBox="0 -960 960 960" width="24" height="24" fill="currentColor" style="vertical-align:-4px"><path d="M367-527q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Zm80-80h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm296.5-343.5Q560-607 560-640t-23.5-56.5Q513-720 480-720t-56.5 23.5Q400-673 400-640t23.5 56.5Q447-560 480-560t56.5-23.5ZM480-640Zm0 400Z"/></svg></p>
      <button class="gate-btn icon-only" onclick="proceedToHeatmap()" aria-label="Start Session" title="Start Session">
        <svg viewBox="0 -960 960 960" width="22" height="22" fill="currentColor"><path d="M80-240v-480h80v480H80Zm560 0-57-56 144-144H240v-80h487L584-664l56-56 240 240-240 240Z"/></svg>
      </button>
    </div>
  </div>
<!-- TOOLBAR AREA -->
  <div class="main">
    <div class="section toolBar">
      <div class="textcontainer">
        <h1 id="scenario-title">Loading…</h1>
        <div class="scenario-nav-status">
          <div class="progress-dots"></div>
        </div>
      </div>

      <div class="instructor-actions">
        <button class="ibtn icon-btn" id="prev-btn" onclick="prevScenario()" aria-label="Back" title="Back">
          <svg viewBox="0 -960 960 960" width="20" height="20" fill="currentColor"><path d="M400-240 160-480l240-240 56 58-142 142h486v80H314l142 142-56 58Z"/></svg>
        </button>
        <button class="ibtn primary icon-btn" id="next-btn" onclick="nextScenario()" aria-label="Next scenario" title="Next scenario">
          <svg viewBox="0 -960 960 960" width="20" height="20" fill="currentColor"><path d="m560-240-56-58 142-142H160v-80h486L504-662l56-58 240 240-240 240Z"/></svg>
        </button>
        <button class="ibtn icon-btn" onclick="refreshHeatmap()" aria-label="Refresh" title="Refresh">
          <svg viewBox="0 -960 960 960" width="20" height="20" fill="currentColor"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></svg>
        </button>
        <button class="ibtn icon-btn" onclick="backToSessions()" aria-label="Sessions" title="Sessions">
          <svg viewBox="0 -960 960 960" width="20" height="20" fill="currentColor"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
        </button>
        <button class="ibtn danger icon-btn" onclick="endSession()" aria-label="End Session" title="End Session">
          <svg viewBox="0 -960 960 960" width="20" height="20" fill="currentColor"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
        </button>
      </div>
    </div>

<!-- FLOORPLAN AREA -->
    <div class="canvas-area" id="canvas-area">
      <div id="floorplan-container">
        <div class="drop-overlay" id="drop-overlay"></div>
        <img id="floorplan-img" src="../assets/floorplan-1.svg" draggable="false">
      </div>
    </div>

    <div class="session-code">
      <span>Session <strong id="session-display">—</strong></span>
      <button class="join-hint-btn" id="join-hint-btn"></button>
    </div>
  </div>
  <div class="submission-counter" id="submission-counter">0/0 <svg viewBox="0 -960 960 960" width="18" height="18" fill="currentColor" style="vertical-align:-3px"><path d="M367-527q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Zm80-80h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm296.5-343.5Q560-607 560-640t-23.5-56.5Q513-720 480-720t-56.5 23.5Q400-673 400-640t23.5 56.5Q447-560 480-560t56.5-23.5ZM480-640Zm0 400Z"/></svg></div>
  <div class="room-tooltip" id="room-tooltip"></div>
</body>
</html>
